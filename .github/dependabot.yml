# Dependabot opens a pull request itself for a new version of a package or image (MIT-33, MC-11).
# Everything is pinned (MIT-03), so without this even security patches never come in by themselves. No pipeline needed.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    # Patches of Python (3.15.x) come in by themselves; a new minor version is a step of its own, because
    # psycopg-binary needs a wheel for it first. Docker tags do not mark an alpha, so 3.16.0a1 would also come.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
