# Research, subquestion 1: Trivy and Syft with Grype on the same images, every measurement on a clean runner of its own.
# Only on lab branches (lab/...), which are never merged; the scripts are in lab/benchmark/.
name: SBoM benchmark

on:
  push:
    branches: ["lab/**"]
  workflow_dispatch:

# No rights by default; the jobs only read the code.
permissions: {}

# With pipefail: an error before tee then fails the step.
defaults:
  run:
    shell: bash

env:
  # The same versions as in the lab measurement of 18 October 2026, pinned on digest.
  TRIVY: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  SYFT: anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa
  GRYPE: anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe

jobs:
  measure:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [trivy, syft, syft-sbom]
        image: [with-pip, without-pip]
        repetition: [1, 2, 3, 4, 5]
    env:
      IMAGE: ${{ matrix.image }}
      REPETITION: ${{ matrix.repetition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image as it is now has pip; without-pip removes it after the install, as a candidate fix.
      - name: Build the image (not measured)
        run: |
          if [ "$IMAGE" = without-pip ]; then
            sed -i 's|^RUN pip install --no-cache-dir -r requirements.txt$|& \&\& pip uninstall --yes pip|' app/Dockerfile
            grep -q 'pip uninstall --yes pip' app/Dockerfile
          fi
          docker build -q -t lab/notes app
          mkdir -p "$RUNNER_TEMP/in"
          docker save lab/notes -o "$RUNNER_TEMP/in/img.tar"
          docker run --rm --entrypoint python lab/notes -m pip --version || echo "no pip in the image"

      - name: Pull the tool images (not measured)
        run: |
          for image in "$TRIVY" "$SYFT" "$GRYPE"; do docker pull -q "$image"; done

      - name: Measure
        run: bash lab/benchmark/measure.sh "${{ matrix.variant }}" "$RUNNER_TEMP/in" "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measurement-${{ matrix.variant }}-${{ matrix.image }}-${{ matrix.repetition }}
          path: |
            ${{ runner.temp }}/out/measurement.json
            ${{ runner.temp }}/out/sbom.json
            ${{ runner.temp }}/out/scan.json
          retention-days: 90

  summarize:
    needs: measure
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: measurement-*
          path: measurements
      - name: Summary
        run: python3 lab/benchmark/summary.py measurements | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measurements-csv
          path: measurements/measurements.csv
          retention-days: 90
